# Builds both extensions on every PR / push to main; on a vX.Y.Z tag, signs the Firefox one on AMO (unlisted)
# and publishes both in a GitHub Release. The native host is not released: it is installed from a clone.
name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:firefox # builds first
      - name: Package Chrome/Arc
        run: cd extension && zip -r ../github-orca-chrome.zip manifest.json options.html dist
      - uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: |
            github-orca-chrome.zip
            extension-firefox/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag against the manifest version
        id: version
        run: |
          version="$(node scripts/release-version.mjs "$GITHUB_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign Firefox (AMO, unlisted)
        run: npm run sign:firefox # builds first
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd extension && zip -r "../github-orca-chrome-$VERSION.zip" manifest.json options.html dist)
          mv web-ext-artifacts/*.xpi "github-orca-firefox-$VERSION.xpi"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "github-orca-chrome-$VERSION.zip" "github-orca-firefox-$VERSION.xpi"
