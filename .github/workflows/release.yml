# Builds and tests on Linux, macOS and Windows for every PR / push to main: unit tests, typecheck, build, a host
# smoke test (one invalid native frame) and an install smoke test (the installer against stub Orca launchers, then the
# installed wrapper; on Windows the installer also runs the build). Ubuntu also lints the Firefox build and uploads
# both extensions. On main, release-please keeps a release PR up to date; merging it tags vX.Y.Z and creates the GitHub
# Release, then the Firefox extension is signed on AMO (unlisted) and both extensions are attached to it. Everything runs in this workflow: tags created with
# GITHUB_TOKEN trigger no other. The native host is not released: it is installed from a clone.
name: Build and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Host smoke test
        run: node scripts/host-smoke.mjs node host/dist/host.cjs
        env:
          GITHUB_ORCA_HOST_MAIN: 1
      - name: Install smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stub="$RUNNER_TEMP/orca-stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\nexit 0\n' > "$stub/orca-ide"
          chmod +x "$stub/orca-ide"
          export PATH="$stub:$PATH"
          mkdir -p ~/.config/google-chrome ~/.mozilla
          GITHUB_ORCA_SKIP_BUILD=1 ./scripts/install.sh
          test -f ~/.config/google-chrome/NativeMessagingHosts/com.stocki.github_orca.json
          test -f ~/.mozilla/native-messaging-hosts/com.stocki.github_orca.json
          node scripts/host-smoke.mjs host/dist/github-orca-host
      - name: Install smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stub="$RUNNER_TEMP/orca-stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\nexit 0\n' > "$stub/orca"
          chmod +x "$stub/orca"
          export PATH="$stub:$PATH"
          mkdir -p "$HOME/Library/Application Support/Google/Chrome"
          GITHUB_ORCA_SKIP_BUILD=1 ./scripts/install.sh
          test -f "$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.stocki.github_orca.json"
          node scripts/host-smoke.mjs host/dist/github-orca-host
      - name: Install smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stub = Join-Path $env:RUNNER_TEMP 'orca-stub'
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          # The invalid frame never invokes Orca; use a real executable to test native launcher discovery.
          Copy-Item -LiteralPath "$env:SystemRoot\System32\where.exe" -Destination (Join-Path $stub 'orca.exe')
          $env:PATH = "$stub;$env:PATH"
          # No GITHUB_ORCA_SKIP_BUILD here: exercise install.ps1's own `npm run build` under Windows PowerShell 5.1.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed (exit code $LASTEXITCODE)" }
          foreach ($key in @(
            'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.stocki.github_orca',
            'HKCU:\Software\Mozilla\NativeMessagingHosts\com.stocki.github_orca'
          )) {
            $manifest = (Get-ItemProperty -LiteralPath $key).'(default)'
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "$key points to a missing file: $manifest" }
            Write-Host "$key = $manifest"
          }
          node scripts/host-smoke.mjs host\dist\github-orca-host.bat
          if ($LASTEXITCODE -ne 0) { throw "host smoke test failed (exit code $LASTEXITCODE)" }
          # Also exercise discovery of legacy cmd launchers, without repeating the build.
          Remove-Item -LiteralPath (Join-Path $stub 'orca.exe')
          Set-Content -LiteralPath (Join-Path $stub 'orca.cmd') -Value "@echo off`r`nexit /b 0" -Encoding ascii
          $env:GITHUB_ORCA_SKIP_BUILD = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "legacy install.ps1 failed (exit code $LASTEXITCODE)" }
          node scripts/host-smoke.mjs host\dist\github-orca-host.bat
          if ($LASTEXITCODE -ne 0) { throw "legacy host smoke test failed (exit code $LASTEXITCODE)" }
      - name: Lint the Firefox build
        if: runner.os == 'Linux'
        run: npm run lint:firefox # builds first
      - name: Package Chrome/Arc
        if: runner.os == 'Linux'
        run: cd extension && zip -r ../github-orca-chrome.zip manifest.json options.html dist
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: extensions
          path: |
            github-orca-chrome.zip
            extension-firefox/

  release-please:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [build, release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag against the manifest version
        id: version
        run: |
          version="$(node scripts/release-version.mjs "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign or retrieve Firefox (AMO, unlisted)
        run: npm run sign:firefox # builds first
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      - name: Attach both extensions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd extension && zip -r "../github-orca-chrome-$VERSION.zip" manifest.json options.html dist)
          gh release upload "$TAG" --clobber "github-orca-chrome-$VERSION.zip" "web-ext-artifacts/github-orca-firefox-$VERSION.xpi"
